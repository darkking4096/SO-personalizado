  - Modified files: SizeSelector.tsx (new), AutoHideToggle.tsx (new), registryManager.ts (extended), taskbarStore.ts (updated), appStore.ts (updated), types/index.ts (updated)
  - Dependencies: No breaking changes to public APIs
